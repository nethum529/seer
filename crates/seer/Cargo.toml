[package]
name = "seer"
version.workspace = true
edition.workspace = true

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30"
rpassword = "7.4"
seer-broker = { path = "../seer-broker" }
seer-core = { path = "../seer-core" }
seer-net = { path = "../seer-net" }
seer-runtime = { path = "../seer-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[[bin]]
name = "seer-broker"
path = "src/bin/seer-broker.rs"

[[bin]]
name = "seer-runtime"
path = "src/bin/seer-runtime.rs"
