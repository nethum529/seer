[workspace]
members = [
    "crates/seer-broker",
    "crates/seer",
    "crates/seer-core",
    "crates/seer-desktop",
    "crates/seer-net",
    "crates/seer-runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.6.0"

[patch.crates-io]
alacritty_terminal = { git = "https://github.com/nethum529/alacritty", rev = "44063686d630958326160ba3c9d61239ae5b6b2a" }

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
