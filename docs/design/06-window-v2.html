<!doctype html>
<html lang="en" data-font="inter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seer window v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* PALETTE START */
:root {
  color-scheme: dark;
  --desk: #141414;
  --bg: #1b1b1b;
  --surface: #222222;
  --raised: #2b2b2b;
  --line: #3a3a3a;
  --line-2: #505050;
  --hover: #292929;
  --sel: #333333;
  --chip: #383838;
  --chip-2: #404040;
  --text: #fafafa;
  --text-2: #d4d4d4;
  --muted: #b8b8b8;
  --faint: #adadad;
  --fainter: #939393;
  --accent: #fafafa;
  --on-accent: #171717;
  --attn: #fbbf24;
  --ok: #4ade80;
  --err: #f87171;
  --a-green: #4ade80;
  --a-yellow: #facc15;
  --a-red: #f87171;
  --a-blue: #60a5fa;
  --a-magenta: #c084fc;
  --a-cyan: #22d3ee;
  --a-orange: #fb923c;
  --scrim: rgba(0, 0, 0, .55);
  --shadow: rgba(0, 0, 0, .5);
}
/* PALETTE END */

/* Fonts. Each candidate has a UI face and a terminal face. All are OFL. */
:root[data-font="inter"] { --ui: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; }
:root[data-font="geist"] { --ui: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; }
:root[data-font="plex"] { --ui: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace; }

/* Type scale. Four sizes, three weights (400, 500, 600). gpui has no letter spacing,
   so every role keeps the tracking of the font. */
:root {
  --fs-sm: 12px; --lh-sm: 16px;
  --fs-md: 13px; --lh-md: 18px;
  --fs-lg: 15px; --lh-lg: 20px;
  --fs-xl: 22px; --lh-xl: 28px;
  --term-fs: 12.5px; --term-lh: 19px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --chrome: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  overflow: hidden; background: var(--desk); color: var(--text); cursor: default;
  font: 400 var(--fs-md)/var(--lh-md) var(--chrome); letter-spacing: 0;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; cursor: default; }
button { background: none; border: 0; padding: 0; margin: 0; text-align: left; }
:focus { outline: none; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic * { vector-effect: non-scaling-stroke; }

/* Mockup chrome. Not part of the product. */
.pick {
  flex: none; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 16px;
  max-width: calc(100vw - 48px); font: 12px/1 var(--chrome);
}
.pick-row { display: flex; gap: 2px; padding: 2px; border: 1px solid #262626; border-radius: 8px; background: #0a0a0a; }
.pick button { height: 26px; padding: 0 10px; border-radius: 6px; color: #a3a3a3; white-space: nowrap; }
.pick button[aria-pressed="true"] { background: #262626; color: #fafafa; }
.pick .lbl { align-self: center; padding: 0 6px 0 8px; color: #737373; }

/* Window */
.win {
  container: win / inline-size;
  position: relative; flex: none; display: flex; flex-direction: column;
  width: min(1360px, calc(100vw - 48px)); height: min(860px, calc(100vh - 96px));
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 12px;
  box-shadow: 0 40px 100px var(--shadow), 0 10px 30px var(--shadow);
  overflow: hidden; user-select: none; -webkit-user-select: none;
  font: 400 var(--fs-md)/var(--lh-md) var(--ui); color: var(--text);
}
:root[data-font="inter"] .win { font-optical-sizing: none; }
.win.narrow { width: min(440px, calc(100vw - 48px)); }
.body { flex: 1; display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 0; }
.solo .body { grid-template-columns: minmax(0, 1fr); }

.lights { display: flex; gap: 8px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25); }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }

/* Sidebar. One grid for every row: an 8 px gutter, a 16 px icon slot that
   starts 10 px in, and text that starts at 44 px. */
.side {
  display: flex; flex-direction: column; min-height: 0; padding: 0 8px;
  background: var(--surface); border-right: 1px solid var(--line);
}
.side-top { flex: none; height: 44px; display: flex; align-items: center; padding-left: 12px; }

.who {
  display: flex; align-items: center; gap: 7px; width: 100%; height: 36px;
  padding: 0 8px 0 7px; border-radius: 8px; color: var(--text);
}
.who-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .sel-ic { color: var(--faint); }
.who[aria-expanded="true"] { background: var(--sel); }
.who-m { display: none; width: auto; height: 32px; padding: 0 6px 0 5px; gap: 7px; }
.who-m .av { width: 20px; height: 20px; font-size: 10px; }

.av {
  flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--chip-2); color: var(--text); font-size: 11px; line-height: 1; font-weight: 600;
}

.newt {
  flex: none; display: flex; align-items: center; gap: 10px; width: 100%; height: 32px;
  margin-top: 4px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-weight: 500;
}

.tabs {
  flex: 1; min-height: 0; overflow-y: auto; margin-top: 12px; padding-bottom: 8px;
  display: flex; flex-direction: column; gap: 2px; scrollbar-width: none; overscroll-behavior: contain;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-rows: var(--lh-md) var(--lh-sm);
  column-gap: 10px; row-gap: 2px; align-items: center; width: 100%; padding: 7px 10px 8px; border-radius: 8px;
}
.tab .st { grid-row: 1; grid-column: 1; }
.tab-name { grid-row: 1; grid-column: 2; min-width: 0; font-weight: 500; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-time { grid-row: 1; grid-column: 3; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--faint); font-variant-numeric: tabular-nums; }
.tab-task {
  grid-row: 2; grid-column: 2 / span 2; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tab.on { background: var(--sel); }
.tab.on .tab-name { color: var(--text); }
.tab.on .tab-task { color: var(--muted); }
.tab.waiting .tab-task { color: var(--muted); }

/* Status: an empty ring is idle, a half disc is working, a full amber disc waits for its person. */
.st { display: block; width: 16px; height: 16px; color: var(--fainter); }
.st.working { color: var(--muted); }
.st.waiting { color: var(--attn); }

/* Inline rename. The field sits where the name was drawn, so the text does not move. */
.rn {
  display: block; width: calc(100% + 6px); height: 22px; margin: -2px 0 -2px -6px; padding: 0 5px;
  border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg);
  color: var(--text); font-weight: 500; line-height: 20px; cursor: text;
  user-select: text; -webkit-user-select: text;
}
.rn:focus-visible { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.rn::placeholder { color: var(--faint); }
.rn::selection { background: color-mix(in srgb, var(--a-blue) 45%, transparent); }

.side-foot {
  flex: none; display: flex; align-items: center; gap: 8px; height: 44px;
  margin: 0 -8px; padding: 0 8px; border-top: 1px solid var(--line);
}
.room {
  display: flex; align-items: center; gap: 10px; min-width: 0; height: 32px;
  padding: 0 8px 0 10px; border-radius: 8px; color: var(--muted);
}
.room-dot { flex: none; display: grid; place-items: center; width: 16px; height: 16px; }
.room-dot i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.room-dot.off i { background: none; box-shadow: inset 0 0 0 1.5px var(--fainter); width: 8px; height: 8px; }
.room-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room .sel-ic { color: var(--faint); }
.room[aria-expanded="true"] { background: var(--sel); color: var(--text); }
.room-m { display: none; }
.icon-btn {
  flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px;
  color: var(--faint);
}
.side-foot .icon-btn { margin-left: auto; }
.icon-btn[aria-expanded="true"] { background: var(--sel); color: var(--text); }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.mbar {
  position: relative; flex: none; height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.mbar .lights, .mbar-act { display: none; }
.solo .mbar .lights { display: flex; grid-column: 1; grid-row: 1; padding-left: 6px; }
.title {
  grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 520px;
  height: 28px; padding: 0 8px; border-radius: 6px; font-weight: 500; color: var(--text); white-space: nowrap;
}
.title .who-of { color: var(--muted); font-weight: 400; }
.title .sep { color: var(--fainter); font-weight: 400; }
.title .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.title .rn { width: 220px; margin: -2px -6px; text-align: center; }
.ro-mark {
  grid-column: 3; grid-row: 1; justify-self: end; display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--faint); white-space: nowrap;
}
.strip {
  flex: none; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: var(--raised);
  font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--muted);
}
.strip .room-dot { width: auto; }

.term {
  flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  padding: 8px 12px; font: 400 var(--term-fs)/var(--term-lh) var(--mono); color: var(--text-2);
  user-select: text; -webkit-user-select: text; cursor: text; white-space: pre; letter-spacing: 0;
}
.term.bottom { justify-content: flex-end; }
.term pre { margin: 0; font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; }
.term pre.cut { white-space: pre; overflow: hidden; }
.cell { display: inline-block; width: 1ch; text-align: center; }
/* The web mono fonts have no box glyphs, and fallback glyphs do not fill the cell. Draw them like a terminal does. */
.bx { position: relative; height: var(--term-lh); vertical-align: top; -webkit-text-fill-color: transparent; }
.bx::before { content: ""; position: absolute; border: 0 solid currentColor; }
.bx.h::before { left: 0; right: 0; top: 50%; border-top-width: 1px; }
.bx.v::before { top: 0; bottom: 0; left: 50%; border-left-width: 1px; }
.bx.tl::before, .bx.tr::before { top: 50%; bottom: 0; border-top-width: 1px; }
.bx.bl::before, .bx.br::before { top: 0; height: calc(50% + 1px); border-bottom-width: 1px; }
.bx.tl::before, .bx.bl::before { left: 50%; right: 0; border-left-width: 1px; }
.bx.tr::before, .bx.br::before { left: 0; width: calc(50% + 1px); border-right-width: 1px; }
.bx.tl::before { border-top-left-radius: 4px; } .bx.tr::before { border-top-right-radius: 4px; }
.bx.bl::before { border-bottom-left-radius: 4px; } .bx.br::before { border-bottom-right-radius: 4px; }
.bx.lb::before { left: 25%; right: 0; top: 2px; bottom: 6px; border-width: 0 0 1px 1px; }
.term .cur { background: var(--text-2); color: var(--bg); }
.g { color: var(--a-green); } .y { color: var(--a-yellow); } .r { color: var(--a-red); } .b { color: var(--a-blue); }
.m { color: var(--a-magenta); } .t { color: var(--a-cyan); } .p { color: var(--a-orange); }
.d { color: var(--faint); } .s { color: var(--muted); } .w { color: var(--text); }
.k { font-weight: 700; }
.da { background: rgba(74, 222, 128, .12); } .dr { background: rgba(248, 113, 113, .12); }
.inv { background: var(--a-green); color: var(--bg); }
.vsl { background: var(--sel); color: var(--text-2); }

.empty { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--faint); }
.empty b { display: block; margin-bottom: 4px; color: var(--text-2); font-weight: 500; }

/* Menus */
.menu {
  position: absolute; z-index: 20; width: 280px; padding: 4px;
  background: var(--raised); border: 1px solid var(--line-2); border-radius: 11px;
  box-shadow: 0 16px 40px var(--shadow), 0 2px 8px var(--shadow);
  opacity: 0; visibility: hidden; transform: scale(.97);
  transition: opacity 80ms var(--ease-out), transform 80ms var(--ease-out), visibility 0s linear 80ms;
}
.menu.open { opacity: 1; visibility: visible; transform: none; transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out); }
.menu:focus-visible { outline: none; }
.mi {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 16px; align-items: center; column-gap: 10px;
  height: 36px; padding: 0 8px; border-radius: 6px; color: var(--text-2);
}
.mi.hi { background: var(--chip); color: var(--text); }
.mi-ic { display: grid; place-items: center; color: var(--faint); }
.mi.hi .mi-ic { color: var(--text-2); }
.mi-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.mi-name small { margin-left: 6px; font-size: var(--fs-sm); font-weight: 400; color: var(--faint); }
.mi-name code { margin-left: 6px; font: 400 var(--fs-sm) var(--mono); color: var(--faint); }
.mi-meta { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mi-meta.waiting { color: var(--attn); }
.mi-check { display: grid; place-items: center; color: var(--text); }
.mi.cur .mi-name { color: var(--text); }
.mi[aria-disabled="true"] { cursor: default; }
.mi.away .av, .mi.away .mi-name > span:first-child { color: var(--faint); }
.mi.offline .av { background: var(--chip); color: var(--faint); }
.mi.offline .mi-name > span:first-child { color: var(--faint); }
.mi.bad, .mi.bad .mi-ic { color: var(--err); }
.mi.bad.hi { background: color-mix(in srgb, var(--err) 7%, var(--raised)); }
.mi-sep { height: 1px; margin: 4px -4px; background: var(--line-2); }
.menu.ctx { width: 184px; }
.menu.ctx .mi { grid-template-columns: 16px minmax(0, 1fr) auto; height: 32px; }

/* Sheets */
.scrim {
  position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px;
  background: var(--scrim);
  opacity: 0; visibility: hidden; transition: opacity 140ms var(--ease-out), visibility 0s linear 140ms;
}
.scrim.open { opacity: 1; visibility: visible; transition: opacity 200ms var(--ease-out); }
.sheet {
  position: relative; width: min(400px, 100%); padding: 20px;
  background: var(--raised); border: 1px solid var(--line-2); border-radius: 14px;
  box-shadow: 0 24px 64px var(--shadow), 0 2px 8px var(--shadow);
  transform: scale(.97); transition: transform 140ms var(--ease-out);
}
.scrim.open .sheet { transform: none; transition: transform 200ms var(--ease-out); }
.sheet.wide { width: min(460px, 100%); }
.sheet h2 { margin: 0; padding-right: 36px; font-size: var(--fs-lg); line-height: var(--lh-lg); font-weight: 600; color: var(--text); }
.sheet p { margin: 8px 0 0; color: var(--muted); text-wrap: pretty; }
.sheet .x { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; }
.sheet-body { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }

.fl { display: block; margin-bottom: 8px; font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: 500; color: var(--muted); }
.inp {
  display: block; width: 100%; min-width: 0; height: 36px; padding: 0 11px;
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg);
  color: var(--text); text-overflow: ellipsis; cursor: text;
  user-select: text; -webkit-user-select: text;
}
.inp.code { font: 400 var(--fs-sm)/1 var(--mono); }
.inp::placeholder { color: var(--faint); }
.inp:focus-visible { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.inp[aria-invalid="true"] { border-color: color-mix(in srgb, var(--err) 55%, transparent); }
.inp[readonly] { color: var(--text-2); }
.inp[type="number"] { appearance: textfield; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
.inp::-webkit-inner-spin-button, .inp::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.msg { margin: 8px 0 0; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--err); text-wrap: balance; }
.msg:empty { display: none; }

.seg {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 2px;
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg);
}
.seg button { height: 30px; border-radius: 5px; color: var(--muted); font-weight: 500; text-align: center; font-variant-numeric: tabular-nums; }
.seg button[aria-checked="true"] { background: var(--chip); color: var(--text); }
.hours { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.hours .inp { width: 72px; }
.hours span { font-size: var(--fs-sm); color: var(--muted); }

.copy-row { display: flex; gap: 8px; }
.copy-row .inp { flex: 1; }
.btn {
  flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 32px; padding: 0 14px; border-radius: 8px; font-weight: 500; white-space: nowrap;
  transition: transform 150ms var(--ease-out);
}
.btn:active { transform: scale(.96); }
.btn.pri { background: var(--accent); color: var(--on-accent); }
.btn.sec { background: var(--chip); color: var(--text); }
.btn.bad { background: var(--err); color: var(--on-accent); }
.btn.pri:focus-visible, .btn.bad:focus-visible { outline: 1px solid var(--text); outline-offset: 2px; }
.acts { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.acts-note { margin-right: auto; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--muted); }
.cp { width: 92px; height: 36px; justify-content: flex-start; padding-left: 12px; }
.cp-ic { display: grid; width: 16px; height: 16px; }
.cp-ic .ic { grid-area: 1 / 1; transition: opacity 300ms cubic-bezier(.2, 0, 0, 1); }
.cp-ic .ok { opacity: 0; color: var(--ok); }
.cp.done .cp-ic .ok { opacity: 1; }
.cp.done .cp-ic .cpy { opacity: 0; }

.join { position: relative; flex: 1; min-height: 0; }
/* A fixed top, so the heading and field do not move when an error line shows. */
.join-form { position: absolute; top: 32%; left: 50%; width: min(360px, 100% - 48px); translate: -50% 0; }
.join h1 { margin: 0 0 24px; font-size: var(--fs-xl); line-height: var(--lh-xl); font-weight: 600; color: var(--text); }
:root[data-font="inter"] .join h1 { font-variation-settings: "opsz" 32; }

@media (hover: hover) {
  .pick button:hover { color: #fafafa; }
  .who:hover, .newt:hover, .room:hover, .tab:not(.on):hover { background: var(--hover); }
  .newt:hover { color: var(--text); }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .title.own:hover { background: var(--hover); }
  .btn.pri:hover { background: #e5e5e5; }
  .btn.sec:hover { background: var(--chip-2); }
  .btn.bad:hover { background: color-mix(in srgb, var(--err) 88%, white); }
  .seg button:not([aria-checked="true"]):hover { color: var(--text); }
}
@media (prefers-reduced-motion: no-preference) {
  .cp-ic .ic { transition-property: opacity, scale, filter; }
  .cp-ic .ok, .cp.done .cp-ic .cpy { scale: .25; filter: blur(4px); }
  .cp.done .cp-ic .ok { scale: 1; filter: blur(0); }
}
@media (prefers-reduced-motion: reduce) {
  .menu, .menu.open, .sheet, .scrim.open .sheet { transform: none; }
  .btn:active { transform: none; }
}

      L(["y", "90be513"], ["", " Release 0.6.0"]),
      L(["g", "marco@marco-studio"], ["", " "], ["b", "~/dev/seer"], ["", " % "], caret)
    ] }),
    fresh: () => ({ lines: [
      L(["", "Welcome to fish, the friendly interactive shell"]),
      L(["", "Type "], ["g", "help"], ["", " for instructions on how to use fish"]),

  };

  // ---- State
  const STATES = [
    ["main", "Main", [["own", "Your terminal"], ["watch", "Watching Kyler"], ["offline", "Person offline"]]],

  const fontLabel = (k) => FONTS.find((f) => f[0] === k)[1];
  function renderPick() {
    const [scr, sub] = at;

    const row = (list, attr, cur) => `<div class="pick-row">${list.map(([k, l]) => `<button type="button" data-${attr}="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div>`;

  // ---- Room view

  const avatar = (p) => `<span class="av">${p.id[0].toUpperCase()}</span>`;
  const roomBtn = (cls) => `<button class="room ${cls}" type="button" data-room aria-haspopup="menu" aria-expanded="false" title="${cap(ROOM.name)}"><span class="room-dot${M.up && !M.after ? "" : " off"}" aria-hidden="true"><i></i></span><span class="room-name">${cap(ROOM.name)}</span>${ICON.sel}</button>`;
  const gearBtn = `<button class="icon-btn" type="button" data-settings aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false">${ICON.gear}</button>`;

  function titleHTML(p, t) {

    return `<div class="title${own ? " own" : ""}" id="title"${own ? ' data-title title="Double click to rename"' : ""}>${who}${name}</div>`;
  }

  function screenHTML(t) {
    const make = SCREENS[t.id] || SCREENS.fresh;

    return `<div class="term" id="term"><pre${s.cut ? ' class="cut"' : ""}>${(s.cut ? s.lines : s.lines.flatMap((l) => wrap(l, cols))).map(html).join("\n")}</pre></div>`;
  }
  // An inline TUI or a shell starts at the top and scrolls only when the screen is full.

  }
  let gridCache = null;
  function measure() {
    const term = $("term");

      probe.remove();

    }

  }

  function roomView() {
    const p = person(), t = termOf(p), live = M.up || M.me !== "nethum";
    const ts = live ? p.terminals : [];

    const who = `${avatar(p)}<span class="who-name">${esc(cap(p.id))}</span>${ICON.sel}`;
    const tabs = ts.map((x) => tabHTML(x, x === tt)).join("");
    const strip = ts.map((x) => stripHTML(x, x === tt)).join("");
    let main;
    if (!M.up && M.me === "nethum") main = '<div class="empty"><div><b>The room is stopped</b>Open the room menu to restore it.</div></div>';
    else if (!tt) main = `<div class="empty"><div><b>${esc(cap(p.id))} is offline</b>Last seen ${p.seen === "3h" ? "3 hours" : p.seen} ago.</div></div>`;
    else main = '<div class="term" id="term"></div>';

    const banner = M.after ? `<div class="strip" role="status"><span class="room-dot off" aria-hidden="true"><i></i></span><span>Room offline. Your terminals keep running.</span></div>` : "";

        <div class="tabs" id="tabs" role="tablist" aria-label="Terminals of ${esc(cap(p.id))}">${tabs}</div>
        <div class="side-foot">${roomBtn("")}${gearBtn}</div>
      </aside>
      <main class="main">
        <header class="mbar">
          <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>

  // ---- Join view
  function joinView() {
    const j = M.join;

    const inv = j.err ? ' aria-invalid="true"' : "";

        <h1 id="jnameL">Choose your name</h1>

      <main class="main">
        <header class="mbar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div></header>

      </main>`;
  }

  function render() {
    win.classList.toggle("solo", M.view === "join");
    win.classList.toggle("narrow", narrow);

    if (M.view === "join") joinView(); else roomView();
    const rn = $("rn");
    if (rn) { rn.focus({ preventScroll: true }); rn.select(); }
  }

  // ---- Menus
  function peopleItems() {
    return P.map((q) => {
      const agents = q.terminals.filter((t) => t.kind === "agent");
      const waiting = agents.some((t) => t.state === "waiting");
      const working = agents.filter((t) => t.state === "working").length;
      let meta = "", mcls = "";
      if (q.presence === "offline") meta = `Offline ${q.seen}`;
      else if (waiting) { meta = "Waiting"; mcls = "waiting"; }
      else if (q.presence === "away") meta = `Away ${q.seen}`;
      else if (working) meta = `${working} working`;
      const marks = [q.id === M.me ? "You" : "", q.host ? "Host" : ""].filter(Boolean).join(", ");
      return { id: "p-" + q.id, go: q.id, cls: `${q.presence}${q.id === M.show ? " cur" : ""}`, ic: avatar(q),
        name: `<span>${esc(cap(q.id))}</span>${marks ? `<small>${marks}</small>` : ""}`, meta, mcls, check: q.id === M.show };
    });
  }
  function roomItems() {
    const cur = { id: "cur", dis: true, cls: "cur", ic: `<span class="room-dot${M.up ? "" : " off"}"><i></i></span>`, name: `<span>${cap(ROOM.name)}</span><code>${ROOM.addr}</code>`, meta: M.up ? `${P.length} people` : "Stopped", check: true };
    const others = OTHER.map((r, i) => ({ id: "o" + i, dis: true, ic: '<span class="room-dot off"><i></i></span>', name: `<span>${cap(r.name)}</span>`, meta: r.state }));
    let acts;
    if (M.me !== "nethum") acts = [{ id: "leave", cls: "bad", ic: ICON.leave, name: "Leave room" }];
    else if (M.up) acts = [{ id: "invite", ic: ICON.invite, name: "Invite a person" }, { id: "stop", cls: "bad", ic: ICON.stop, name: "Stop room" }];
    else acts = [{ id: "restore", ic: ICON.restore, name: "Restore room" }, { id: "fresh", cls: "bad", ic: ICON.fresh, name: "Start a new room" }];
    return [cur, ...others, null, ...acts];
  }
  const ctxItems = () => [{ id: "rename", ic: ICON.pencil, name: "Rename" }];

  function renderMenu() {

      ? `<div class="mi${it.cls ? " " + it.cls : ""}${n === hi ? " hi" : ""}" id="mi-${it.id}" role="${role}"${it.dis ? ' aria-disabled="true"' : ""}${role === "option" ? ` aria-selected="${!!it.check}"` : ""} data-n="${n}">` +
        `<span class="mi-ic">${it.ic}</span><span class="mi-name">${it.name}</span>` +
        (menuKind === "ctx" ? "" : `<span class="mi-meta${it.mcls ? " " + it.mcls : ""}">${it.meta || ""}</span><span class="mi-check">${it.check ? ICON.check : ""}</span>`) + "</div>"

      menu.style.top = (point.y - wr.top) + "px";

    const left = Math.max(8, Math.min(tr.left - wr.left, wr.width - w - 8));

    if (kind === "ctx") { startRename(ctx, "tab"); mark("rename", "edit"); return; }
    if (it.id === "invite") { M.inv = { hours: 24, custom: false, ready: false, err: null }; openSheet("invite", o); mark("invite", "pick"); }
    else if (it.id === "stop" || it.id === "leave" || it.id === "fresh") { openSheet(it.id, o); mark("room", it.id); }

  }
  const refocus = (sel) => { const b = visible(sel); if (b) b.focus({ preventScroll: true }); };

  // ---- Rename
  function startRename(id, where) {
    const p = person();
    if (!mine() || !p.terminals.some((t) => t.id === id)) return;

  }
  function endRename(save) {

  }

  // ---- Sheets
  const fmtHours = (h) => (h === 168 ? "7 days" : h === 24 ? "1 day" : h === 1 ? "1 hour" : `${h} hours`);
  const xBtn = `<button class="icon-btn x" type="button" data-close aria-label="Close">${ICON.x}</button>`;
  function inviteHTML() {
    const v = M.inv;
    if (v.ready) {
      const row = (id, lab, val) => `<div><label class="fl" for="${id}">${lab}</label><div class="copy-row"><input class="inp code" id="${id}" readonly value="${esc(val)}"><button class="btn sec cp" type="button" data-copy="${id}"><span class="cp-ic">${ICON.copy}${ICON.ok}</span><span class="cp-l">Copy</span></button></div></div>`;
      return `<h2 id="shTitle">Invite a person</h2>${xBtn}
        <div class="sheet-body">${row("ln1", "For a friend who has Seer", JOIN_LINE)}${row("ln2", "For a friend who needs Seer", INSTALL_LINE)}</div>
        <div class="acts"><span class="acts-note">Works once. Expires in ${fmtHours(v.hours)}.</span><button class="btn pri" type="button" data-close>Done</button></div>`;
    }

    const seg = PRESETS.map(([h, l]) => `<button type="button" role="radio" aria-checked="${h === sel}" tabindex="${h === sel ? 0 : -1}" data-h="${h}">${l}</button>`).join("");
    const custom = v.custom ? `<div class="hours"><input class="inp" id="hrs" type="number" inputmode="numeric" min="1" max="168" value="${v.hours}" aria-label="Hours" aria-describedby="hrsN hrsE"${v.err ? ' aria-invalid="true"' : ""}><span id="hrsN">Hours, 1 to 168</span></div><p class="msg" id="hrsE">${v.err ? ERR.hours : ""}</p>` : "";
    return `<h2 id="shTitle">Invite a person</h2>${xBtn}
      <div class="sheet-body"><div><span class="fl" id="durL">Expires after</span><div class="seg" role="radiogroup" aria-labelledby="durL">${seg}</div>${custom}</div></div>
      <div class="acts"><button class="btn pri" type="button" data-create>Create invite</button></div>`;

  const others = () => P.length - 1;
  const CONFIRM = {
    stop: () => [`Stop ${cap(ROOM.name)}?`, `${others()} people lose the room. Their own terminals keep running. Your terminals on this computer stop too.`, "Stop room"],

  };
  function sheetHTML(kind) {
    if (kind === "invite") return inviteHTML();
    if (kind === "settings") return `<h2 id="shTitle">Settings</h2>${xBtn}<p id="shDesc">Settings come in a later build.</p>`;
    const [t, p, b] = CONFIRM[kind]();
    return `<h2 id="shTitle">${t}</h2><p id="shDesc">${p}</p>
      <div class="acts"><button class="btn sec" type="button" data-close>Cancel</button><button class="btn bad" type="button" data-confirm="${kind}">${b}</button></div>`;
  }
  function paintSheet(focusSel) {
    sheet.className = "sheet" + (M.sheet === "invite" ? " wide" : "");
    sheet.innerHTML = sheetHTML(M.sheet);
    if (M.sheet === "invite") sheet.removeAttribute("aria-describedby"); else sheet.setAttribute("aria-describedby", "shDesc");
    const f = sheet.querySelector(focusSel);

  }

    if (sheetOpener) sheetOpener.setAttribute("aria-expanded", "true");
    scrim.classList.toggle("instant", viaKey);
    scrim.classList.add("open");

  }
  function closeSheet(refocusIt) {
    if (!M || !M.sheet) return;
    const kind = M.sheet;

    scrim.classList.remove("open");
    body.inert = false;
    document.querySelectorAll("[data-settings]").forEach((b) => b.setAttribute("aria-expanded", "false"));
    if (refocusIt) refocus(kind === "settings" ? "[data-settings]" : "[data-room]");
    sheetOpener = null;
  }
  function confirm(kind) {
    closeSheet(false);
    if (kind === "stop") { M.up = false; render(); refocus("[data-room]"); mark("room", "stopped"); }
    else if (kind === "leave") { M.view = "join"; M.join = { step: "paste", err: null, line: "", name: "Kyler" }; render(); $("jline").focus(); mark("join", "paste"); }
    else if (kind === "fresh") { M.up = true; render(); M.inv = { hours: 1, custom: false, ready: true, err: null }; openSheet("invite"); mark("invite", "ready"); }
  }
  function createInvite() {
    const v = M.inv;
    if (v.custom) {
      const h = +$("hrs").value;
      if (!Number.isInteger(h) || h < 1 || h > 168) { v.err = true; paintSheet("#hrs"); return; }
      v.hours = h;
    }
    v.ready = true; v.err = null;
    paintSheet("[data-copy]");
    mark("invite", "ready");
  }
  function pickHours(h) {
    const v = M.inv;
    v.custom = h === 0; v.err = null;
    if (h) v.hours = h; else v.hours = v.hours === 24 ? 48 : v.hours;
    paintSheet(`[data-h="${h}"]`);
    mark("invite", h ? "pick" : "custom");
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).catch(() => fallbackCopy(text)); return; }
    fallbackCopy(text);
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) { /* clipboard blocked */ }
    ta.remove();
  }
  function flashCopied(btn) {
    btn.classList.add("done");
    btn.querySelector(".cp-l").textContent = "Copied";
    $("live").textContent = "Copied";
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.classList.remove("done"); btn.querySelector(".cp-l").textContent = "Copy"; $("live").textContent = ""; }, 1600);
  }

  function submitJoin() {
    const j = M.join;
    if (j.step === "paste") {
      j.line = $("jline").value.trim();
      const word = j.line.split(/\s+/).reverse().find((w) => w.startsWith("SEER"));
      if (!word || !/^SEER2-[0-9a-f]{64}-[0-9a-f]{64}$/.test(word)) { j.err = "bad"; render(); $("jline").focus(); mark("join", "bad"); return; }
      j.err = null; j.step = "name"; render(); $("jname").select(); mark("join", "name");
      return;
    }
    j.name = $("jname").value.trim() || "Kyler";
    M.view = "room"; M.me = "kyler"; M.show = "kyler"; M.up = true;
    render(); refocus("[data-room]"); mark("room", "guest");
  }

  function newTerminal() {
    const me = byId(M.me);
    const t = { id: "new-" + Date.now().toString(36), program: "fish", name: "", kind: "shell", state: "idle", since: "now", task: "~/Projects/seer" };
    me.terminals.push(t);
    M.pick[me.id] = t.id;
    M.show = me.id;
    closeSheet(false); closeMenu(false);
    render();
    const tab = visible(`[data-t="${t.id}"]`);
    if (tab) tab.focus({ preventScroll: true });
  }

  // ---- Mockup states
  function apply(scr, sub) {
    closeMenu(false); closeSheet(false); reset();
    mark(scr, sub);
    if (scr === "join") {
      M.view = "join";
      const j = M.join;
      if (sub === "bad") { j.line = "seer join SEER2-9f3c2a7e5b1d"; j.err = "bad"; }
      if (sub === "used" || sub === "reach") { j.line = JOIN_LINE; j.err = sub; }
      if (sub === "name" || sub === "taken") j.step = "name";
      if (sub === "taken") j.err = "taken";
      render();
      return;
    }
    if (scr === "main") {
      if (sub === "watch") M.show = "kyler";
      if (sub === "offline") M.show = "ana";
      render();
      return;
    }
    if (scr === "people") { render(); openMenu("people", visible("[data-people]")); return; }
    if (scr === "settings") { render(); openSheet("settings", visible("[data-settings]")); return; }
    if (scr === "rename") {
      if (sub === "saved") { byId("nethum").terminals[0].name = "Stop buffer fix"; render(); return; }
      if (sub === "clear") { byId("nethum").terminals[1].name = ""; M.pick.nethum = "n2"; render(); return; }
      if (sub === "edit") { startRename("n1", narrowNow() ? "strip" : "tab"); return; }
      if (sub === "title") { startRename("n1", narrowNow() ? "strip" : "title"); return; }
      render();
      const tab = visible('[data-t="n1"]');
      const r = tab.getBoundingClientRect();
      M.ctx = "n1";
      openMenu("ctx", null, { at: { x: r.left + 72, y: r.top + 18 } });
      return;
    }
    if (scr === "invite") {
      render();
      M.inv = { hours: sub === "custom" ? 48 : 24, custom: sub === "custom", ready: sub === "ready", err: null };
      openSheet("invite", visible("[data-room]"));
      return;
    }
    if (sub === "guest" || sub === "leave" || sub === "after") { M.me = "kyler"; M.show = "kyler"; }
    if (sub === "stopped" || sub === "fresh") M.up = false;
    if (sub === "after") M.after = true;
    render();
    if (sub === "host" || sub === "guest" || sub === "stopped") openMenu("room", visible("[data-room]"));
    else if (sub !== "after") openSheet(sub, visible("[data-room]"));
  }
  const narrowNow = () => win.getBoundingClientRect().width < 720;

  // ---- Events
  $("pick").addEventListener("click", (e) => {
    const s = e.target.closest("[data-scr]");
    if (s) { const subs = STATES.find((x) => x[0] === s.dataset.scr)[2]; apply(s.dataset.scr, subs[0][0]); return; }
    const u = e.target.closest("[data-sub]");
    if (u) { apply(at[0], u.dataset.sub); return; }
    const f = e.target.closest("[data-font]");
    if (f) { font = f.dataset.font; document.documentElement.dataset.font = font; document.fonts.ready.then(() => apply(...at)); renderPick(); return; }
    const w = e.target.closest("[data-width]");
    if (w) { narrow = w.dataset.width === "narrow"; win.classList.toggle("narrow", narrow); apply(...at); }
  });

  body.addEventListener("click", (e) => {
    if (e.detail > 1) return;
    if (e.target.closest(".rn")) return;
    const pb = e.target.closest("[data-people]");
    if (pb) { if (opener === pb) closeMenu(true); else openMenu("people", pb); return; }
    const rb = e.target.closest("[data-room]");
    if (rb) { if (opener === rb) closeMenu(true); else openMenu("room", rb); return; }
    if (e.target.closest("[data-new]")) { newTerminal(); return; }
    const sb = e.target.closest("[data-settings]");
    if (sb) { openSheet("settings", sb); mark("settings", "open"); return; }
    const tab = e.target.closest("[data-t]");
    if (tab) {
      if (M.rename) endRename(true);
      M.pick[M.show] = tab.dataset.t; render();
      const nt = visible(`[data-t="${tab.dataset.t}"]`); if (nt) nt.focus({ preventScroll: true });
      return;
    }
    if (e.target.closest("[data-back]")) { M.join.step = "paste"; M.join.err = null; render(); $("jline").focus(); mark("join", "paste"); }
  });
  body.addEventListener("dblclick", (e) => {
    if (e.target.closest(".rn")) return;
    const tab = e.target.closest("[data-t]");
    if (tab) { startRename(tab.dataset.t, tab.classList.contains("mtab") ? "strip" : "tab"); mark("rename", "edit"); return; }
    const title = e.target.closest("[data-title]");
    if (title) { const t = termOf(person()); startRename(t.id, "title"); mark("rename", "title"); }
  });
  body.addEventListener("contextmenu", (e) => {
    const tab = e.target.closest("[data-t]");
    if (!tab || !mine()) return;
    e.preventDefault();
    M.pick[M.show] = tab.dataset.t; render();
    M.ctx = tab.dataset.t;
    openMenu("ctx", null, { at: { x: e.clientX, y: e.clientY } });
    mark("rename", "menu");
  });
  body.addEventListener("focusout", (e) => {
    if (e.target.id === "rn" && M.rename && !e.target._done) { e.target._done = true; setTimeout(() => endRename(true)); }
  });
  body.addEventListener("keydown", (e) => {
    if (e.target.id === "rn") {
      if (e.key === "Enter") { e.preventDefault(); e.target._done = true; endRename(true); }
      else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); e.target._done = true; endRename(false); }
      return;
    }
    const tab = e.target.closest("[data-t]");
    if (tab) {
      const list = [...tab.parentElement.querySelectorAll("[data-t]")];
      const i = list.indexOf(tab);
      const go = { ArrowDown: i + 1, ArrowRight: i + 1, ArrowUp: i - 1, ArrowLeft: i - 1, Home: 0, End: list.length - 1 }[e.key];
      if (go !== undefined) {
        e.preventDefault();
        const id = list[(go + list.length) % list.length].dataset.t;
        M.pick[M.show] = id; render();
        const nt = visible(`[data-t="${id}"]`); if (nt) nt.focus({ preventScroll: true });
        return;
      }
      if (e.key === "F2") { e.preventDefault(); startRename(tab.dataset.t, tab.classList.contains("mtab") ? "strip" : "tab"); mark("rename", "edit"); return; }
      if ((e.key === "F10" && e.shiftKey) || e.key === "ContextMenu") {
        if (!mine()) return;
        e.preventDefault();
        const r = tab.getBoundingClientRect();
        M.ctx = tab.dataset.t;
        openMenu("ctx", tab, { at: { x: r.left + 72, y: r.top + 18 } });
        return;
      }
    }
    const trig = e.target.closest("[data-room], [data-people]");
    if (trig && !menuKind && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      openMenu(trig.matches("[data-room]") ? "room" : "people", trig, { last: e.key === "ArrowUp" });
    }
  });
  body.addEventListener("submit", (e) => { e.preventDefault(); submitJoin(); });
  body.addEventListener("input", (e) => {
    if (!M.join.err || !e.target.matches("#jline, #jname")) return;
    M.join.err = null;
    e.target.removeAttribute("aria-invalid");
    $("jmsg").textContent = "";
  });

  menu.addEventListener("mousemove", (e) => {
    const row = e.target.closest(".mi:not([aria-disabled])");
    if (row && +row.dataset.n !== hi) setHi(+row.dataset.n);
  });
  menu.addEventListener("click", (e) => {
    const row = e.target.closest(".mi:not([aria-disabled])");
    if (row) act(+row.dataset.n);
  });
  sheet.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) { closeSheet(true); return; }
    const h = e.target.closest("[data-h]");
    if (h) { pickHours(+h.dataset.h); return; }
    if (e.target.closest("[data-create]")) { createInvite(); return; }
    const c = e.target.closest("[data-copy]");
    if (c) { copyText($(c.dataset.copy).value); flashCopied(c); return; }
    const k = e.target.closest("[data-confirm]");
    if (k) confirm(k.dataset.confirm);
  });
  sheet.addEventListener("keydown", (e) => {
    const r = e.target.closest('[role="radio"]');
    if (r && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      e.preventDefault();
      const all = [...sheet.querySelectorAll('[role="radio"]')];
      const n = all[(all.indexOf(r) + (e.key === "ArrowRight" ? 1 : -1) + all.length) % all.length];
      pickHours(+n.dataset.h);
      return;
    }
    if (e.key === "Enter" && e.target.id === "hrs") { e.preventDefault(); createInvite(); }
  });
  document.addEventListener("mousedown", (e) => {
    if (menuKind && !menu.contains(e.target) && !(opener && opener.contains(e.target))) closeMenu(false);
  });
  scrim.addEventListener("mousedown", (e) => { if (e.target === scrim) closeSheet(true); });
  window.addEventListener("resize", () => {
    if (menuKind) closeMenu(false);
    if (M.view === "room" && $("term")) { gridCache = null; const t = termOf(person()); if (t) paintTerm(t); }
  });
  document.addEventListener("keydown", (e) => {
    if (menuKind) {
      if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
      else if (e.key === "Home") { e.preventDefault(); setHi(actionable()[0]); }
      else if (e.key === "End") { e.preventDefault(); setHi(actionable().slice(-1)[0]); }
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(hi); }
      else if (e.key === "Escape") { e.preventDefault(); closeMenu(true); }
      else if (e.key === "Tab") closeMenu(false);
      return;
    }
    if (M.sheet) {
      if (e.key === "Escape") { e.preventDefault(); closeSheet(true); return; }
      if (e.key === "Tab") {
        const f = [...sheet.querySelectorAll("button, input")].filter((el) => el.tabIndex >= 0);
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === "t" && M.view === "room") { e.preventDefault(); newTerminal(); }
  });

  document.addEventListener("keydown", () => { viaKey = true; }, true);
  document.addEventListener("pointerdown", () => { viaKey = false; }, true);

  // ---- Start
  const want = location.hash.slice(1).split("&");
  const [ws, wsub] = (want[0] || "").split("/");
  want.slice(1).forEach((kv) => {
    const [k, v] = kv.split("=");
    if (k === "font" && FONTS.some((f) => f[0] === v)) font = v;
    if (k === "narrow") narrow = true;
  });
  document.documentElement.dataset.font = font;
  win.classList.toggle("narrow", narrow);
  const known = STATES.find((x) => x[0] === ws);
  const start = known && known[2].some((x) => x[0] === wsub) ? [ws, wsub] : at;
  reset();
  apply(...start);
  document.fonts.ready.then(() => { if (!M.sheet && !menuKind && !M.rename) apply(...at); else if (M.view === "room" && $("term")) { gridCache = null; const t = termOf(person()); if (t) paintTerm(t); } });
})();
</script>
</body>
</html>
